aid: anomali
name: Anomali
description: >-
  Anomali is an enterprise cybersecurity vendor whose Agentic SOC Platform unifies
  threat intelligence, security data, and agentic AI. Its flagship ThreatStream is
  a leading Threat Intelligence Platform (TIP) that operationalizes indicators of
  compromise across a Unified Security Data Lake with SIEM, SOAR, and XDR
  capabilities. Anomali exposes a ThreatStream REST API (api.threatstream.com) for
  managing intelligence, observables, investigations, and integrations, and
  maintains a partner marketplace of prebuilt integrations. This API Evangelist
  profile was seeded from the general-catalyst portfolio and enriched from
  Anomali's public surfaces (status page, security/responsible-disclosure program,
  privacy and terms pages, GitHub organization, and blog).
