- name: Anomali ThreatStream API
  description: REST API for the Anomali ThreatStream Threat Intelligence Platform — manage threat intelligence, observables, investigations, imports,
    and integrations. Authentication uses an apikey credential in the Authorization header. Detailed reference is available to authenticated ThreatStream
    customers.
  humanURL: https://www.anomali.com/products/threatstream
  baseURL: https://api.threatstream.com
  properties:
  - type: StatusPage
    url: https://status.anomali.com
  - type: Documentation
    url: https://docs.anomali.com/Content/ThreatStream%20API/introduction_api.htm
  aid: anomali:anomali-threatstream-api
- name: Anomali ThreatStream MCP Server
  description: Remote Model Context Protocol server for ThreatStream at https://api.threatstream.com/mcp. Its OAuth protected-resource metadata
    (/.well-known/oauth-protected-resource) names the resource "ThreatStream MCP Server" and scopes MCP_READ_TS_DATA, MCP_WRITE_TS_DATA, MCP_READ_PIR_DATA,
    MCP_WRITE_PIR_DATA, MCP_ENRICHMENTS_ACCESS and MCP_SA_ACCESS; anonymous tools/list returns 401 (WWW-Authenticate ApiKey realm="MCP").
  humanURL: https://docs.anomali.com/Content/ThreatStream%20API/introduction_api.htm
  baseURL: https://api.threatstream.com/mcp
